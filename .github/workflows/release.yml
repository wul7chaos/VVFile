name: Release

# 打 tag 就发版：git tag v1.0.0 && git push origin v1.0.0
# 也可以在 Actions 页面手动跑一次，填版本号即可。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不要带 v，例如 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 取源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: 配 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 算版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CODE=$(python3 - "$VERSION" <<'PY'
          import sys
          parts = (sys.argv[1].split("-")[0].split(".") + ["0", "0"])[:3]
          major, minor, patch = (int(x) for x in parts)
          print(major * 10000 + minor * 100 + patch)
          PY
          )
          echo "版本 $VERSION → versionCode $CODE"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 准备发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.VVFILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VVFILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VVFILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VVFILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::没配签名密钥（VVFILE_KEYSTORE_BASE64），这次用 debug 签名出包，不能覆盖安装"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          {
            echo "storeFile=$KS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "签名密钥已就位：$KS"

      - name: 修可执行位
        run: chmod +x gradlew

      - name: 跑单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 打 release 包
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PvvVersionName="${{ steps.ver.outputs.name }}" \
            -PvvVersionCode="${{ steps.ver.outputs.code }}"

      - name: 收包与校验和
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.name }}"
          mkdir -p out
          APK="out/VVFile-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ( cd out && sha256sum "VVFile-$VERSION.apk" > "VVFile-$VERSION.apk.sha256" )
          ls -lh out
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 确认签名
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "${{ steps.pack.outputs.apk }}" | head -5

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release create "$TAG" \
              out/VVFile-"$VERSION".apk out/VVFile-"$VERSION".apk.sha256 \
              --title "VVFile $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes
          else
            gh release create "$TAG" \
              out/VVFile-"$VERSION".apk out/VVFile-"$VERSION".apk.sha256 \
              --title "VVFile $VERSION" \
              --generate-notes \
              --latest
          fi

      - name: 顺手留个构建产物
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: VVFile-apk-${{ steps.ver.outputs.name }}
          path: out/
          if-no-files-found: warn

